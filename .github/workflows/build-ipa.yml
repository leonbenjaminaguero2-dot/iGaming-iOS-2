name: Build iGaming IPA
'on':
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project iGaming.xcodeproj -scheme iGaming -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iGaming.app Payload/
          zip -qr iGaming-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iGaming-IPA
          path: iGaming-unsigned.ipa
